plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rmstock.verification'
    compileSdk 34

    defaultConfig {
        applicationId "com.rmstock.verification"
        minSdk 21            // Android 5.0 and above = practically every phone / handheld scanner
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly on any phone.
            // For Play Store / company MDM distribution, replace with your own keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    // Native QR / barcode scanner. Does NOT need Google Play Services, so it works on every Android device.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.1'
}
